# Grades every finished prediction and updates reports/track_record.md and docs/.
name: score

on:
  schedule:
    - cron: "0 6 * * 1"    # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pitwall-commits
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.pitwall_cache
          key: pitwall-${{ github.run_id }}
          restore-keys: pitwall-
      - run: pip install -e ".[ml]"
      - run: pitwall-f1 score
      - name: Settle paper tickets and write reports/market.md (no real money)
        run: |
          pitwall-f1 paper settle
          pitwall-f1 paper report
      - name: Commit the track record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports docs predictions 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing new to commit."; exit 0; fi
          git commit -m "Track record update ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          exit 1
